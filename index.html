<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlo English</title>
<meta name="description" content="Learn English every day: words, games, quizzes and speaking.">
<meta name="theme-color" content="#3D5AFE">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parlo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header id="topbar">
    <a class="brand" href="#home"><span class="logo">P</span>Parlo</a>
    <div class="stats">
      <span class="chip fire" id="streak" title="Days in a row">🔥 0</span>
      <span class="chip gem" id="xp" title="Points">⭐ 0</span>
      <a class="chip gear" href="#settings" aria-label="Settings">⚙️</a>
    </div>
  </header>
  <main id="view" tabindex="-1"><p class="sub">Loading…</p></main>
  <nav id="tabs" aria-label="Main">
    <div>
      <a href="#home" data-tab="home" style="--c:var(--blue)"><span class="ti">🏠</span>Home</a>
      <a href="#learn" data-tab="learn" style="--c:var(--orange)"><span class="ti">📖</span>Learn</a>
      <a href="#cards" data-tab="cards" style="--c:var(--green)"><span class="ti">🃏</span>Words</a>
      <a href="#play" data-tab="play" style="--c:var(--purple)"><span class="ti">🎮</span>Play</a>
      <a href="#speak" data-tab="speak" style="--c:var(--pink)"><span class="ti">🎤</span>Speak</a>
    </div>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
