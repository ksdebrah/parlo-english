<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlo English</title>
<meta name="description" content="Practise English every day: lessons, flashcards, quizzes and speaking.">
<meta name="theme-color" content="#2F7D5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parlo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="#home">Parlo<span>.</span></a>
    <div class="stats">
      <span class="chip sun" id="streak" title="Days in a row">🔥 0</span>
      <span class="chip" id="xp">0 XP</span>
      <a class="chip icon" href="#settings" aria-label="Settings">⚙︎</a>
    </div>
  </header>
  <main id="view" tabindex="-1"><p class="sub">Loading…</p></main>
  <nav aria-label="Main">
    <div>
      <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#lessons" data-tab="lessons"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>Lessons</a>
      <a href="#cards" data-tab="cards"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="14" height="18" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2"/></svg>Cards</a>
      <a href="#quiz" data-tab="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17h.01"/></svg>Quiz</a>
      <a href="#speak" data-tab="speak"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>Speak</a>
    </div>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
